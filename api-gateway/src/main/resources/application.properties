server.port=8070

spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id=amount-service
spring.cloud.gateway.routes[0].uri=lb://AMOUNT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/amount/**
spring.cloud.gateway.routes[0].filters[0]=Retry=3